# Kernel Research Agent — Orchestrator Configuration
# Copy to config.yaml and fill in your values.

providers:
  claude:
    api_key_env: ANTHROPIC_API_KEY        # reads from this env var
    model: claude-opus-4-6-20250514       # task execution — big model
    max_tokens: 16384
    extended_thinking:
      enabled: true
      budget_tokens: 32768
    auxiliary:
      model: claude-haiku-4-5-20251001    # summarization, classification — small model

  openai:
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1-2025-04-14            # task execution — big model
    max_tokens: 16384
    # base_url: https://api.openai.com/v1  # optional override
    auxiliary:
      model: gpt-4.1-mini-2025-04-14     # summarization fallback — small model

alloy:
  # Options: random, alternating, strategic, budget
  strategy: strategic

  # Used by strategic + budget routers:
  reasoning_model: claude
  workhorse_model: openai

  # For random strategy (uncomment):
  # weights:
  #   claude: 0.7
  #   openai: 0.3

  # For budget strategy (uncomment):
  # premium_ratio: 0.3

mcp_servers:
  windbg:
    transport: stdio
    command: python
    args: ["-m", "windbg_mcp"]
    env:
      CONNECTION_STRING: "${WINDBG_CONNECTION_STRING}"

  ida:
    transport: stdio
    command: python
    args: ["-m", "ida_mcp"]
    env:
      IDA_MCP_BINARY: "${IDA_MCP_BINARY}"

  gadget:
    transport: stdio
    command: python
    args: ["-m", "gadget_finder"]

  sysinternals:
    transport: stdio
    command: python
    args: ["-m", "sysinternals_mcp"]

orchestrator:
  max_turns: 100
  max_consecutive_errors: 3
  context_limit_tokens: 180000

cache:
  tool_cache_size: 512
  tool_cache_ttl: 3600        # seconds

knowledge_base:
  system_prompt_path: ./system_prompt.md
